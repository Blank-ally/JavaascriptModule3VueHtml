        <form novalidate @submit.prevent="editCurrentStar">
            <div class="row">
                <div class="col-md-6 order-sm-1">
                    <div class="col-md-6 float-md-end mb-3 ms-md-3">
                        <img  class="img-fluid img-thumbnail h-100 w-100 " v-if="editStar.photo != null " :src="editStar.photo"/>
                        &lt;!&ndash;<div class="input-group px-3  py-3 ">
                            <label class="input-group-text" for="inputGroupFile01">Upload image</label>
                            <input type="file" class="form-control" id="inputGroupFile01" v-model="editStar.photo">
                        </div>&ndash;&gt;
                        <div class="input-group px-3  py-3 ">
                            <label class="input-group-text" for="inputGroupFile01">Upload image</label>
                            <input type="text" class="form-control" id="inputGroupFile01" v-model="editStar.photo">
                        </div>
                    </div>
                </div>

                <div class="col-md-6 order-sm-2">


                    <div class="row">
                        <div class=" col-md-4 px-4  py-3 px-md-0">
                            <label for="StarName" class="form-label">Star Name</label>
                            <input type="text" class="form-control" id="StarName" required v-model="editStar.name">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 px-4  py-3 px-md-0">


                            <label for="StarClusterName" class="form-label">Cluster</label>
                            <input type="text" class="form-control" id="StarClusterName" required v-model="editStar.Cluster" :value="currentCluster.name">
                           &lt;!&ndash; <select class="form-select" aria-label="Default select example" v-model="editStar.Cluster">
                                <option selected disabled>Cluster Name</option>
                                <option v-for="cluster in CLusterList" :value="cluster.name">{{cluster.name}}</option>

                            </select>&ndash;&gt;
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 px-4  py-3 px-md-0">
                            <label>Classification</label>
                            <select class="form-select" aria-label="Default select example" v-model="editStar.Classi">
                                <option selected disabled>Classification</option>
                                <option v-for="cl in currentCluster.classifications" :value="cl.name">{{cl.name}}</option>

                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class=" col-md-4 px-4  py-3 px-md-0">
                            <label for="Qty" class="form-label">Qty</label>
                            <input type="number" class="form-control" min="1" id="Qty" required v-model="editStar.qty">
                        </div>
                    </div>

                    <div class="row">
                        <div class=" col-md-4 px-4  py-3 px-md-0 ">
                            <div class="form-floating ">
                                <textarea class="form-control " placeholder="Leave a comment here" id="floatingTextarea2" style="height: 100px" v-model="editStar.notes"></textarea>
                                <label for="floatingTextarea2">Notes</label>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class=" col-md-4 px-4  py-3 px-md-0">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" role="switch" id="flexSwitchCheckDefault" data-bs-toggle="collapse" data-bs-target="#collapseExample" aria-expanded="false" aria-controls="collapseExample" v-model="editStar.Trade">
                                <label class="form-check-label" for="flexSwitchCheckDefault">Trade</label>
                            </div>
                        </div>
                    </div>

                    <div class="collapse" id="collapseExample">
                        <div class="row">
                            <div class="col-md-4 px-4  py-3 px-md-0">
                                <label for="TadeQty" class="form-label">Qty to trade</label>
                                <input type="number" class="form-control" id="TadeQty" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 px-4  py-3 px-md-0">
                                <select class="form-select" aria-label="Default select example">
                                    <option selected disabled>Trade for</option>
                                    <option value="1">Another Star</option>
                                    <option value="2">Money</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 px-4  py-3 px-md-0">
                                <label for="ClusterName" class="form-label">Price</label>
                                <input type="text" class="form-control" id="ClusterName" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 px-4  py-3 px-md-0">
                                <select class="form-select" aria-label="Default select example">
                                    <option selected>Condition</option>
                                    <option value="1">One</option>
                                    <option value="2">Two</option>
                                    <option value="3">Three</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="row justify-content-center">
                        <div class="col-3 col-md-2 p-2">
                            <button class="btn btn-success" type="submit">Save</button>
                        </div>
                        <div class="col-3 col-md-2 p-2">
                            <a class="btn btn-danger" role="button" aria-disabled="true" href="Cluster.html">Cancel</a>
                        </div>
                    </div>
                    </div>

                    </div>



        </form>
    </div>

    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Delete {{currentStar.name}}?</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>

                <div class="modal-body">

                <div class="modal-footer">

                    <button type="button" class="btn btn-outline-primary" data-bs-dismiss="modal">Cancel</button>

    <q-layout view="hHh lpR fFf">

        <l-nav-list :pages="pages"></l-nav-list>

        <q-drawer v-model="rightDrawerOpen" side="right" overlay elevated>
            <!-- drawer content -->
        </q-drawer>

        <q-page-container>
            <div class="row justify-center ">
                <div class="col-6 text-center text-h3 q-pa-lg">
                    Edit Star
                </div>
            </div>

            <div class="row justify-content-start ">
                <div class="col-6 text-center text-h3 q-pa-lg">
                    <q-btn  padding="lg xl" flat  @click="confirm = true">
                        <q-icon>
                            <i class="fa-solid fa-trash"></i>
                        </q-icon>
                    </q-btn>
                </div>
            </div>


            <div class=" row justify-center" style="max-width:400px;max-height: 1000px ">
                <q-form
                        @submit="editCurrentStar"
                        @reset="onReset"
                        class="q-gutter-xl"
                >

                    <div class="q-pa-md">
                        <div class="q-col-gutter-md row justify-center">
                            <div class="col-6">
                                <q-img v-model="editStar.photo" src="https://cdn.quasar.dev/img/parallax2.jpg" :ratio="4/3">

                                </q-img>
                            </div>
                        </div>


                    </div>

                    <q-input
                            filled
                            v-model="editStar.photo"
                            label="Star img"
                            lazy-rules
                            bg-color="white"
                            :rules="[ val => val && val.length > 0 || 'Please type something']"

                    ></q-input>

                    <q-input
                            filled
                            v-model="editStar.name"
                            label="Star Name"
                            lazy-rules
                            bg-color="white"
                            :rules="[ val => val && val.length > 0 || 'Please type something']"

                    ></q-input>
                    <q-input
                            filled
                            v-model="editStar.cluster"
                            label="Cluster"
                            lazy-rules
                            disabled
                            bg-color="white"
                    >
                    </q-input>

                    <q-select standout v-model="editStar.classi" :options="currentCluster.classifications.map(item => ({value: item, label: item.name}))" label="Classifications"   bg-color="white"></q-select>


                    <q-input
                            filled
                            type="number"
                            v-model="editStar.qty"
                            label="Qty"
                            lazy-rules
                            bg-color="white"
                            :rules="[
            val => val !== null && val !== '' || 'Please type your age',
            val => val > 0 && val < 100 || 'Please type a real age'
          ]"
                    ></q-input>
                    <q-input
                            v-model="editStar.notes"
                            filled
                            label="Notes"
                            type="textarea"
                            bg-color="white"
                    ></q-input>


                    <q-toggle v-model="editStar.Trade" label="Trade" ></q-toggle>



                    <q-btn label="Submit" type="submit" color="primary"></q-btn>
                    <q-btn label="Cancel" href="Cluster.html" color="primary"  class="q-ml-lg"></q-btn>









                </q-form>
            </div>
            <!-- modal -->
            <q-dialog v-model="confirm" persistent>
                <q-card  style="width: 700px; max-width: 80vw;">
                    <q-card-section class="row items-center">

                        <div class="text-h6">Delete {{currentStar.name}}?</div>
                    </q-card-section>

                    <q-card-section class="q-pt-none">

                        Once deleted a Star cannot be recovered are you sure you want to delete this Star.
                    </q-card-section>

                    <q-card-actions align="right">
                        <div class="q-gutter-xl">
                            <q-btn flat label="Delete" color="primary" v-close-popup @click="deleteStar(currentStar)"></q-btn>
                        </div>
                        <div class="q-gutter-xl">
                            <q-btn flat label="Cancel" color="primary" v-close-popup ></q-btn>
                        </div>
                    </q-card-actions>
                </q-card>
            </q-dialog>

        </q-page-container>


    </q-layout>
</div>
